name: Update

"on":
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tools/**"
      - "tests/**"
      - "vendor/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: jayblock-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_artifact: ${{ steps.prepare.outputs.has_artifact }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Build lists
        env:
          PYTHONPATH: src
        run: python3 tools/build.py --profile all

      - name: Test
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Guard against empty publish
        run: |
          test -s dist/aggressive.txt
          python3 - << 'PY'
          from pathlib import Path
          text = Path("dist/aggressive.txt").read_text()
          domains = [line for line in text.splitlines() if line and not line.startswith("#")]
          if len(domains) < 10000:
              raise SystemExit(f"refusing to publish {len(domains)} domains")
          print(f"ok {len(domains)} domains")
          PY

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "No artifact changes"
          else
            git commit -m "$(cat <<'EOF'
          Update generated Little Snitch blocklists.

          EOF
          )"
            git push
          fi

      - name: Prepare GitHub Pages artifact
        id: prepare
        run: echo "has_artifact=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
